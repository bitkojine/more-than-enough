<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- What the page may load and run (test/unit/security.test.js keeps the
     inline script's hash in step). connect-src names the room service. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-eEhbGB8L7GioktMj0MvqRGI5IC+ZM5LBP0QJJPgTCL4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://mte-rooms.usernametologinwith.workers.dev wss://mte-rooms.usernametologinwith.workers.dev http://localhost:8787 ws://localhost:8787; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<title data-i18n="game.title"></title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05070a" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="" data-i18n-content="game.shortTitle" />
<meta name="application-name" content="" data-i18n-content="game.title" />
<!-- scripts/stage-site.sh stamps a build hash onto every asset URL (here and
     in each module import) so GitHub Pages' 10-minute cache can't serve a
     stale build. Keep plain paths in the source. -->
<link rel="stylesheet" href="style.css" />
<script>
  // Fail loud: anything that breaks the game (an exception, a module that
  // failed to load) is shown on screen with what broke, never a frozen map.
  (function () {
    // This runs before the game's modules (which may be what failed), so it
    // carries its own few words in every language; test/unit/i18n.test.js
    // checks they match. The language is picked as src/i18n/i18n.js does.
    var CRASH_TEXT = {
      en: { title: 'The game broke', reload: 'Reload', game: 'Game', failedToLoad: 'Failed to load', unhandled: 'Unhandled promise rejection' },
      lt: { title: 'Žaidimas sugedo', reload: 'Perkrauti', game: 'Žaidimas', failedToLoad: 'Nepavyko įkelti', unhandled: 'Neapdorotas pažado atmetimas' }
    };
    function language() {
      var asked = null;
      try { asked = new URLSearchParams(location.search).get('lang') || localStorage.getItem('mte.lang'); } catch (e) { asked = null; }
      if (asked && CRASH_TEXT[asked]) return asked;
      var wanted = (navigator.languages || []).concat([navigator.language]);
      for (var i = 0; i < wanted.length; i++) {
        var code = String(wanted[i] || '').slice(0, 2).toLowerCase();
        if (CRASH_TEXT[code]) return code;
      }
      return 'en';
    }
    var words = CRASH_TEXT[language()];
    // Everything we know about an error: its kind and message (Safari's
    // stack leaves both out), where it was thrown, and the stack.
    function describe(err, where) {
      if (!err || typeof err !== 'object') return String(err) + (where ? '\n  at ' + where : '');
      var head = (err.name || 'Error') + ': ' + (err.message || '(no message)');
      var stack = String(err.stack || '');
      if (stack.indexOf(head) === 0) stack = stack.slice(head.length).replace(/^\n/, '');
      return head + (stack ? '\n' + stack : where ? '\n  at ' + where : '');
    }
    var shown = false;
    function crash(what) {
      var box = document.getElementById('crash');
      if (!box) return document.addEventListener('DOMContentLoaded', function () { crash(what); });
      var text = typeof what === 'string' ? what : describe(what);
      var pre = box.querySelector('pre');
      if (!shown) {
        shown = true;
        box.querySelector('strong').textContent = words.title;
        box.querySelector('button').textContent = words.reload;
        box.querySelector('button').addEventListener('click', function () { location.reload(); });
        pre.textContent = words.game + ' v' + (window.MTE_VERSION || '?') + ', ' + new Date().toISOString() + '\n' + navigator.userAgent + '\n\n';
      }
      box.hidden = false;
      pre.textContent += text + '\n\n';
      if (window.console) console.error('[MTE crash] ' + text);
    }
    window.MTE_CRASH = crash;
    function ours(url) { return !url || url.indexOf(location.origin + '/') === 0; }
    window.addEventListener('error', function (e) {
      var el = e.target;
      if (el && el !== window && (el.src || el.href)) return crash(words.failedToLoad + ' ' + (el.src || el.href));
      // An error the browser hides from us ("Script error.", no error object)
      // or one from another origin was thrown by code that isn't the game:
      // iOS Safari runs its own and share extensions' scripts in the page when
      // the Share sheet opens. Note it and keep playing.
      if (e.error == null || !ours(e.filename)) {
        if (window.console) console.warn('[MTE] ignored an error from a script that is not the game: ' +
          (e.message || '(no message)') + (e.filename ? ' at ' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
        return;
      }
      crash(describe(e.error, e.filename && e.filename + ':' + e.lineno + ':' + e.colno));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      crash(words.unhandled + ': ' + describe(e.reason));
    });
  })();
</script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- The heads-up display. Status along the top (trophies, the resource
       bar, settings), situational status down the left edge (depth), every
       action in the bottom-right thumb cluster. See docs/ui.md. -->
  <div id="hud">
    <div id="topbar">
      <button id="btnAwards" class="hudBtn" type="button" data-i18n-aria-label="hud.awards"><svg class="trophy" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v5a5 5 0 0 1-10 0z" /><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" /><path d="M12 13v4M8 21h8M9.5 17h5v4h-5z" /></svg><span id="awardCount">0</span></button>
      <div id="resources"></div>
      <button id="btnSettings" class="hudBtn" type="button" data-i18n-aria-label="settings.title"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg></button>
    </div>
    <div id="friends" role="group" data-i18n-aria-label="together.friends" hidden></div>
    <pre id="perf" aria-live="off" hidden></pre>
    <div id="milestone" role="status" aria-live="polite" hidden><svg class="trophy" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v5a5 5 0 0 1-10 0z" /><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" /><path d="M12 13v4M8 21h8M9.5 17h5v4h-5z" /></svg><small><span class="label" data-i18n="hud.milestone"></span> <span class="of"></span></small><strong></strong></div>
  </div>

  <div id="depthMeter" aria-live="polite">
    <div id="depth" hidden></div>
    <div id="depthGauge" aria-hidden="true" hidden></div>
  </div>

  <div id="controls" role="group" data-i18n-aria-label="hud.controls">
    <div id="zoomControls" data-i18n-aria-label="hud.zoom">
      <button id="btnZoomIn" type="button" data-i18n-aria-label="hud.zoomIn">+</button>
      <button id="zoomLevel" type="button"><span id="zoomText">1×</span></button>
      <button id="btnZoomOut" type="button" data-i18n-aria-label="hud.zoomOut">&minus;</button>
    </div>
    <div id="thumbDock">
      <button id="btnBuild" class="btn" type="button" data-i18n-aria-label="button.build.aria">
        <img class="big" data-look="ui.build" alt=""><span class="cap" data-i18n="button.build"></span>
      </button>
      <button id="btnUpgrade" class="btn" type="button" data-i18n-aria-label="button.upgrade.aria">
        <img class="big" data-look="ui.upgrade" alt=""><span class="cap" data-i18n="button.upgrade"></span>
      </button>
      <button id="btnMine" class="btn" type="button" hidden>
        <img class="big" id="mineIcon" data-look="ui.climbDown" alt=""><span class="cap" id="mineLabel"></span>
      </button>
      <button id="btnAction" class="btn" type="button">
        <img class="big" id="actionIcon" data-look="ui.gather" alt=""><span class="cap" id="actionLabel"></span>
      </button>
    </div>
  </div>

  <!-- Every list in the game is this one sheet: tabs (or, for a screen
       outside them, its title) beside a ×, and a scrolling body. Swipe it down by the handle or tap the map to close. -->
  <div id="sheet" aria-hidden="true">
    <div id="sheetGrab" aria-hidden="true"><span></span></div>
    <div id="sheetHead">
      <div id="sheetTitle"></div>
      <div id="tabs" role="tablist">
        <button class="tab active" type="button" role="tab" data-tab="upgrades" data-i18n="sheet.upgrades"></button>
        <button class="tab" type="button" role="tab" data-tab="build" data-i18n="sheet.build"></button>
        <button class="tab" id="tabBeyond" type="button" role="tab" data-tab="beyond" data-i18n="sheet.beyond"></button>
        <button class="tab" type="button" role="tab" data-tab="awards" data-i18n="sheet.awards"></button>
      </div>
      <button id="btnClose" class="hudBtn" type="button" data-i18n-aria-label="sheet.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
    </div>
    <div id="sheetBody"></div>
    <div id="settingsPanel" hidden>
      <div class="setGroup">
        <button id="btnTogether" class="setRow together" type="button" hidden><span id="togetherLabel"></span><b aria-hidden="true">&#9638;</b></button>
        <button id="btnRejoin" class="setRow" type="button" hidden><span data-i18n="together.rejoin"></span></button>
        <button id="btnLeave" class="setRow" type="button" hidden><span data-i18n="together.leave"></span></button>
      </div>
      <div class="setGroup">
        <button id="btnMute" class="setRow" type="button"><span data-i18n="settings.sound"></span><b id="muteState"></b></button>
        <button id="btnDrag" class="setRow" type="button" aria-pressed="false"><span data-i18n="sheet.drag"></span><b id="dragMode"></b></button>
        <button id="btnLanguage" class="setRow" type="button"><span data-i18n="sheet.language"></span><b data-i18n="language.name"></b></button>
      </div>
      <div class="setGroup">
        <button id="btnTextures" class="setRow" type="button"><span data-i18n="sheet.textures"></span><b id="packName"></b></button>
        <button id="btnTexturesDefault" class="setRow" type="button" hidden><span data-i18n="sheet.texturesDefault"></span></button>
        <a id="wikiLink" class="setRow" href="wiki/" target="_blank" rel="noopener"><span data-i18n="sheet.wiki"></span><b aria-hidden="true">&#8599;</b></a>
      </div>
      <div class="setGroup danger">
        <button id="btnReset" class="setRow" type="button"><span data-i18n="sheet.reset"></span></button>
      </div>
      <div id="version"><span id="brand" translate="no">byrforr</span><span id="verText"></span></div>
      <input id="packFile" type="file" accept=".json,application/json,image/*" multiple hidden />
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="packReport" class="scrim" role="alert" hidden>
    <div class="dialog warn">
      <strong data-i18n="pack.notUsed"></strong>
      <ul></ul>
      <div class="choices"><button type="button" class="secondary" data-i18n="pack.close"></button></div>
    </div>
  </div>
  <div id="ask" class="scrim" role="alertdialog" aria-labelledby="askTitle" hidden>
    <div class="dialog">
      <strong id="askTitle"></strong>
      <p></p>
      <div class="choices"><button type="button" class="secondary"></button><button type="button" class="primary"></button></div>
    </div>
  </div>
  <!-- Holding up the QR: your wanderer lifts a sign with the code on it. -->
  <div id="qr" class="scrim" role="dialog" aria-labelledby="qrTitle" hidden>
    <div class="holdup">
      <strong id="qrTitle" data-i18n="together.qr.title"></strong>
      <div class="sign">
        <div class="board"><canvas id="qrCanvas" width="280" height="280" role="img" data-i18n-aria-label="together.qr.title"></canvas></div>
        <div class="stalk"></div>
      </div>
      <img class="holder" data-look="character.wanderer" data-slot="image" alt="">
      <p data-i18n="together.qr.text"></p>
      <div class="choices"><button id="qrDone" type="button" class="primary" data-i18n="together.qr.done"></button></div>
    </div>
  </div>
  <div id="fork" class="scrim" role="alertdialog" aria-labelledby="forkTitle" hidden>
    <div class="dialog">
      <strong id="forkTitle" data-i18n="fork.title"></strong>
      <div class="picks"></div>
    </div>
  </div>
  <div id="crash" role="alert" hidden>
    <strong></strong>
    <pre></pre>
    <button type="button"></button>
  </div>

  <script type="module" src="src/game/main.js"></script>
</body>
</html>
