<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>More Than Enough</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05070a" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="data:," />
<!-- scripts/stage-site.sh stamps a build hash onto every asset URL (here and
     in each module import) so GitHub Pages' 10-minute cache can't serve a
     stale build. Keep plain paths in the source. -->
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="version"><span id="brand">byrforr</span><span id="verText"></span></div>
    <div id="resources"></div>
    <div id="depth" aria-live="polite" hidden></div>
  </div>

  <div id="controls" role="group" aria-label="Thumb controls">
    <div id="zoomControls" aria-label="Map zoom">
      <button id="btnZoomOut" type="button" aria-label="Zoom out">&minus;</button>
      <span id="zoomLevel" aria-live="polite">100%</span>
      <button id="btnZoomIn" type="button" aria-label="Zoom in">+</button>
    </div>
    <div id="thumbDock">
      <button id="btnBuild" class="btn" type="button" aria-label="Build extractor">
        <span class="big">&#127957;</span><span class="cap">BUILD</span>
      </button>
      <button id="btnUpgrade" class="btn" type="button" aria-label="Upgrades">
        <span class="big">&#128295;</span><span class="cap">UPGRADE</span>
      </button>
      <button id="btnMine" class="btn" type="button" aria-label="Descend into the mine">
        <span class="big" id="mineIcon">&#9935;</span><span class="cap" id="mineLabel">MINE</span>
      </button>
      <button id="btnAction" class="btn" type="button" aria-label="Gather">
        <span class="big" id="actionIcon">&#129296;</span><span class="cap" id="actionLabel">GATHER</span>
      </button>
    </div>
  </div>

  <div id="sheet" aria-hidden="true">
    <div id="sheetGrab" aria-hidden="true"><span></span></div>
    <div id="sheetHead">
      <div id="sheetTitle">Upgrades</div>
    </div>
    <div id="sheetBody"></div>
    <div id="sheetFoot">
      <div id="sheetNav">
        <div id="tabs">
          <button class="tab active" type="button" data-tab="upgrades">Upgrades</button>
          <button class="tab" type="button" data-tab="build">Build</button>
          <button class="tab" id="tabBeyond" type="button" data-tab="beyond">Beyond</button>
        </div>
        <button id="btnClose" type="button" aria-label="Done">Done</button>
      </div>
      <div id="sheetUtilities">
        <a id="wikiLink" href="wiki/" target="_blank" rel="noopener">Wiki</a>
        <button id="btnReset" type="button">Reset world</button>
        <button id="btnMute" type="button">Sound: on</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="src/game/main.js"></script>
</body>
</html>
