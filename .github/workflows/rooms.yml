# Test, then deploy the room service for playing together (server/) to
# Cloudflare Workers. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets (a token from the "Edit Cloudflare Workers" template).
# Runs when the service or anything it shares with the game changes: the wire
# format, and the game's rules (src/core, and the i18n they use), which the
# room replays to keep its own copy of everyone's progress (server/src/shadow.js).

name: Room service

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/net/**', 'src/core/**', 'src/i18n/**', '.github/workflows/rooms.yml', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rooms
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node and the dev dependencies
        uses: ./.github/actions/setup

      - name: Unit tests (the room's rules among them)
        run: npm test

      - name: Install wrangler (exact versions from the lockfile)
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # COMMIT: the service names the commit it runs at / (scripts/live-check.mjs).
        run: npx wrangler deploy --var COMMIT:${{ github.sha }}

      - name: The moderator's token (the ROOMS_ADMIN_TOKEN secret, if set)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROOMS_ADMIN_TOKEN: ${{ secrets.ROOMS_ADMIN_TOKEN }}
        run: |
          if [ -n "$ROOMS_ADMIN_TOKEN" ]; then printf '%s' "$ROOMS_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN; else echo "No ROOMS_ADMIN_TOKEN: the moderator routes stay off."; fi

      - name: Smoke test the live service
        env:
          ROOMS_ADMIN_TOKEN: ${{ secrets.ROOMS_ADMIN_TOKEN }}
        run: node server/smoke.mjs https://rooms.robertasrudys.com https://play.robertasrudys.com
