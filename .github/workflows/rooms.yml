# Test, then deploy the room service for playing together (server/) to
# Cloudflare Workers. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets (a token from the "Edit Cloudflare Workers" template).
# Runs when the service or the wire format it shares with the game changes.

name: Room service

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/net/**', 'src/core/format.js', '.github/workflows/rooms.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rooms
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (latest LTS, from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Unit tests (the room's rules among them)
        run: npm test

      - name: Install wrangler (exact versions from the lockfile)
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test the live service
        run: node server/smoke.mjs https://mte-rooms.usernametologinwith.workers.dev https://play.robertasrudys.com
