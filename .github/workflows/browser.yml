# The whole browser suite (test/browser.e2e.js, ~340 checks) against the
# staged site players get, on every push and pull request. It plays in a
# randomly seeded world, so a red run is re-run once before it counts; the
# job fails only when both runs fail, and both logs are kept.
#
# Its own workflow, beside Test and deploy rather than inside it, so it never
# holds up a deploy; scripts/live-check.mjs leaves it out of the deploy
# check and the failed run itself is the signal.
name: Browser suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node and the dev dependencies
        uses: ./.github/actions/setup

      - name: Stage the site
        run: npm run stage

      - name: Play the game in headless Chrome (re-run once if red)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          MTE_SITE: site
          MTE_SHOT_DIR: ${{ runner.temp }}/browser-shots
        run: |
          node test/browser.e2e.js > "$RUNNER_TEMP/browser-1.log" 2>&1 && { tail -3 "$RUNNER_TEMP/browser-1.log"; exit 0; }
          grep -E 'FAIL|E2E ' "$RUNNER_TEMP/browser-1.log" || true
          echo "::warning::Browser suite failed once; re-running in a new world"
          node test/browser.e2e.js > "$RUNNER_TEMP/browser-2.log" 2>&1 && { tail -3 "$RUNNER_TEMP/browser-2.log"; exit 0; }
          grep -E 'FAIL|E2E ' "$RUNNER_TEMP/browser-2.log" || true
          exit 1

      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite
          path: |
            ${{ runner.temp }}/browser-*.log
            ${{ runner.temp }}/browser-shots
