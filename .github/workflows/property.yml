name: Extended property checks
on:
  push:
    branches: [main]
    paths: ['src/core/**', 'src/net/**', 'test/property/**', '.github/workflows/property.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: properties-${{ github.ref }}
  cancel-in-progress: true
jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:extended
