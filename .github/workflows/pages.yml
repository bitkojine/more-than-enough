# Test, then deploy the game to GitHub Pages. The source runs as it is;
# scripts/stage-site.sh copies the static files, makes them quick to load
# (scripts/stage-speed.mjs: one pictures file, code bundled and minified) and
# stamps a cache-busting hash onto asset URLs.
# Runs on every push to main, on pull requests (tests only), and on demand.

name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node and the dev dependencies
        uses: ./.github/actions/setup

      - name: Node version
        run: node --version

      - name: Unit tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node and the dev dependencies
        uses: ./.github/actions/setup

      - name: Stage the site (bundled, cache-busted)
        run: sh scripts/stage-site.sh site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
